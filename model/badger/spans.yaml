# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/refs/heads/main/schemas/semconv.schema.json
groups:
  - id: span.badger.session
    type: span
    span_kind: internal
    stability: development
    brief: The post-installation lifetime of an instrumented badger.
    note: >-
      This is the root span and SHOULD be named `badger.session`. Start it after
      installation completes. Make the sampling decision when the session
      starts; tail sampling is not suitable because the badger is consumed by
      the session.
    entity_associations:
      - badger
    attributes:
      - ref: badger.session.id
        requirement_level: required
      - ref: badger.traceparent
        requirement_level: required
      - ref: badger.tracestate
        requirement_level:
          conditionally_required: If vendor state is physically present on the badger.
      - ref: badger.timing.degraded
        requirement_level:
          conditionally_required: If `badger.adapter.timing_class` is `polled`.
        sampling_relevant: true
      - ref: badger.prelude.duration
        requirement_level: recommended
      - ref: badger.prelude.timestamp_source
        requirement_level: required
